name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all

  macos-app:
    name: macOS app (check, frontend)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/macos/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Frontend check
        run: pnpm --filter @elocutio/macos check
      - name: Frontend build
        run: pnpm --filter @elocutio/macos build
      - name: Rust format
        run: cargo fmt --manifest-path apps/macos/src-tauri/Cargo.toml -- --check
      - name: Rust check
        run: cargo check --manifest-path apps/macos/src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path apps/macos/src-tauri/Cargo.toml

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Markdown and naming
        run: python3 scripts/check_docs.py
      - name: Validate progress tracker
        run: python3 scripts/progress.py validate
      - name: Test progress tracker
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

  format:
    name: Format (web/config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
