name: CI

# Routine CI intentionally runs on Linux only. GitHub Free charges macOS
# runners at 10x the Linux minute rate, so the full Tauri app check lives in
# `.github/workflows/macos-app.yml` and runs only on demand, on a PR label, or
# on a release tag. Run `just macos-check` locally before opening a macOS PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Markdown and naming
        run: python3 scripts/check_docs.py
      - name: Validate progress tracker
        run: python3 scripts/progress.py validate
      - name: Test progress tracker
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

  web:
    name: Web (Prettier, Svelte check/build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: Frontend check
        run: pnpm --filter @elocutio/macos check
      - name: Frontend build
        run: pnpm --filter @elocutio/macos build
