name: CI

# Routine CI runs on Linux. The macOS app lives in its own workspace
# (`apps/macos/src-tauri` is excluded from the root cargo workspace) and needs
# a macOS runner to compile, so the app checks live in
# `.github/workflows/macos-app.yml`.
#
# That workflow is NOT label-only any more: it also runs automatically on every
# push and pull request that touches the app, so the 11k lines of Rust that
# make up the product are inside an automatic gate. The `paths` filter keeps
# the expensive macOS job off unrelated doc-only changes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Markdown and naming
        run: python3 scripts/check_docs.py
      - name: Validate progress tracker
        run: python3 scripts/progress.py validate
      - name: Test progress tracker
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

  web:
    name: Web (Prettier, Svelte check/build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: Frontend check
        run: pnpm --filter @elocutio/macos check
      - name: Frontend build
        run: pnpm --filter @elocutio/macos build

  security:
    name: Security (dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit the macOS app dependency tree
        run: cargo audit --file apps/macos/src-tauri/Cargo.lock
