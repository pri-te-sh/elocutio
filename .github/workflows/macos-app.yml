name: macOS app

# The macOS app is a separate cargo workspace (`apps/macos/src-tauri` is
# excluded from the root workspace), so it needs its own job. It used to run
# only on demand, which left the product outside every automatic gate; it now
# also runs automatically whenever the app, the shared crates, or the toolchain
# change. The `paths` filter keeps it off unrelated doc-only changes, because
# GitHub Free bills macOS runners at 10x the Linux rate.
#
# Run it by:
#   - Actions → macOS app → Run workflow, or
#   - adding the `macos-app` label to a pull request, or
#   - pushing a `v*` release tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/macos/**"
      - "crates/**"
      - "vendor/harper/**"
      - ".github/workflows/macos-app.yml"
      - "rust-toolchain.toml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/macos/**"
      - "crates/**"
      - "vendor/harper/**"
      - ".github/workflows/macos-app.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos-app:
    name: macOS app (check, frontend, tests, bundle)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event.label.name == 'macos-app'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/macos/src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Frontend check
        run: pnpm --filter @elocutio/macos check
      - name: Frontend build
        run: pnpm --filter @elocutio/macos build
      - name: Rust format
        run: cargo fmt --manifest-path apps/macos/src-tauri/Cargo.toml -- --check
      - name: Rust clippy
        run: cargo clippy --manifest-path apps/macos/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust check
        run: cargo check --manifest-path apps/macos/src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path apps/macos/src-tauri/Cargo.toml
      - name: Build the app bundle
        # The bundle config, icons, Info.plist, and bundle identifier are only
        # exercised by a real `tauri build`. Without this step a broken
        # `tauri.conf.json` would ship.
        run: cd apps/macos && pnpm exec tauri build --debug --bundles app
