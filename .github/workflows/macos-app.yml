name: macOS app

# The macOS app is a separate cargo workspace (`apps/macos/src-tauri` is
# excluded from the root workspace), so it needs its own job on a macOS runner,
# the slowest and most expensive kind (10x the Linux rate on private repos).
#
# It runs once per change, on the pull request, and only when the app, the
# shared crates, or the toolchain change. It does not run again when the pull
# request merges to main (the PR run already tested that code) or on release
# tags (the release workflow builds the app itself). Run it by hand from
# Actions → macOS app → Run workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/macos/**"
      - "crates/**"
      - "vendor/harper/**"
      - ".github/workflows/macos-app.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos-app:
    name: macOS app (check, frontend, tests, bundle)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/macos/src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Frontend check
        run: pnpm --filter @elocutio/macos check
      - name: Frontend build
        run: pnpm --filter @elocutio/macos build
      - name: Rust format
        run: cargo fmt --manifest-path apps/macos/src-tauri/Cargo.toml -- --check
      - name: Rust clippy
        run: cargo clippy --manifest-path apps/macos/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust check
        run: cargo check --manifest-path apps/macos/src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path apps/macos/src-tauri/Cargo.toml
      - name: Build the app bundle
        # The bundle config, icons, Info.plist, and bundle identifier are only
        # exercised by a real `tauri build`. Without this step a broken
        # `tauri.conf.json` would ship.
        run: cd apps/macos && pnpm exec tauri build --debug --bundles app
