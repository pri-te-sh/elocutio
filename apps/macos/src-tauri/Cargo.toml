[package]
name = "elocutio-desktop"
version = "0.1.0"
description = "Elocutio: a private writing companion for macOS"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pri-te-sh/elocutio"
publish = false

[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["custom-protocol", "image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.23.1"
winit = "0.30.13"
thiserror = "2.0.18"
egui = "0.34.1"
egui-winit = "0.34.1"
egui-wgpu = { version = "0.34.1", features = ["winit"] }
pollster = "1.0.1"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
elocutio-analysis = { path = "../../../crates/elocutio-analysis" }
elocutio-core = { path = "../../../crates/elocutio-core" }
elocutio-llm = { path = "../../../crates/elocutio-llm" }
elocutio-voice = { path = "../../../crates/elocutio-voice" }
harper-core = { path = "../../../vendor/harper/harper-core", default-features = false, features = ["concurrent"] }
harper-dictionary-wordlist = { path = "../../../vendor/harper/harper-dictionary-wordlist" }
egui_commonmark = "0.23.0"
tokio = { version = "1.52.1", default-features = false, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tauri-plugin-os = "2.3.2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
cached = "2.0.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
is-macro = "0.3.7"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2.0"
send_wrapper = "0.6.0"
raw-window-handle = "0.6"
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSApplication",
    "NSImage",
    "NSRunningApplication",
    "NSWorkspace",
    "NSPasteboard",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSGeometry",
    "NSString",
    "objc2-core-foundation",
] }
accessibility-sys = "0.2.0"
core-graphics = "0.25.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
uiautomation = { version = "0.25.0", features = ["process"] }
wintheon = "0.1.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]

[profile.release]
opt-level = 3
lto = "fat"
